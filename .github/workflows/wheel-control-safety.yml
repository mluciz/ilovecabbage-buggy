name: Wheel control safety
on:
  push:
    branches: [main, fix/full-app-wheel-safety-20261111]
  pull_request:

permissions:
  contents: read

jobs:
  python-firmware-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Tk/Xvfb and firmware simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk g++
          python -m pip install --upgrade pip
          python -m pip install -r controller/requirements.txt pytest
      - name: Run original GUI, BLE, route and updated motor regression tests
        working-directory: controller
        run: xvfb-run -a python -m pytest -q
      - name: Compile Arduino firmware for real Uno board toolchain
        uses: arduino/setup-arduino-cli@v2
      - name: Compile sketches
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli compile --fqbn arduino:avr:uno controller/arduino/BuggyController
          arduino-cli compile --fqbn arduino:avr:uno controller/arduino/MotorTest
