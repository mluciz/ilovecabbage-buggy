name: Spatial Lab - Python protocols and simulation

on:
  push:
    paths:
      - "unreal-visualizer/**"
      - ".github/workflows/spatial-lab-ci.yml"
  pull_request:
    paths:
      - "unreal-visualizer/**"
      - ".github/workflows/spatial-lab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-session-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: unreal-visualizer
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q tools tests
      - name: Protocol, geometry, capture and replay tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke tests
        shell: bash
        run: |
          python tools/demo_sender.py --duration 0.2 --hz 10 --scenario arena
          python tools/demo_sender.py --duration 0.2 --hz 10 --scenario sensor-dropout
